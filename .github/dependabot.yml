version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Batch everything into one PR per stream instead of one PR per package.
    # `groups` only covers version updates by default, so security updates get
    # their own group — otherwise Dependabot alerts still arrive one PR each.
    # If a major ever blocks the batch, split it out with a third group scoped to
    # `update-types: ["major"]`.
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # eslint-config-next / eslint-plugin-react don't support ESLint 10 yet;
      # the 9 -> 10 bump broke `npm run lint`. Re-allow once they do.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TS 7 yet; the 6 -> 7 bump makes
      # `npm run lint` fail to start, though `next build` still passes — so CI
      # stays green and the breakage only shows up locally. TS 6 is the highest
      # version that lints. Drop this once typescript-eslint ships TS 7 support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

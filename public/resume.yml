summary: |
  Senior Staff Platform Engineer and architect focused on enterprise developer experience, internal developer platforms, and AI-native software delivery. I design and scale the systems thousands of engineers rely on across CI/CD, DevOps intelligence, cloud platforms, and AI/ML delivery. I build paved roads and self-service platforms, treating developer experience as a first-class product.
experience:
  - company: The Hartford
    position: Senior Staff Software Engineer — Enterprise Platform Engineering
    location: Hartford, CT
    startDate: 2023
    endDate: Present
    summary: |
      Technical Lead for The Hartford's enterprise developer platform and developer experience strategy — the single pane of glass serving 8,000+ engineers — owning the architecture and evolution of CI/CD, DevOps intelligence, internal developer tooling, and AI-native delivery patterns across thousands of repositories.
    highlights:
      - Lead the strategy, design, and delivery of the internal developer platform serving 8,000+ engineers, including a CEO-sponsored initiative making developer onboarding self-service — the platform provisions a new machine to productive in hours, down from a 40+ day baseline, now rolling out org-wide
      - Shipped a unified developer surface across a custom CLI, desktop app, and IDE extensions, reaching 1,000+ active engineers in the first 90 days
      - Designed "one build command, any stack" — context-aware builds that run identically locally, in CI, or fully remote on virtual build agents, against a custom base-image registry
      - Architected a real-time DevOps intelligence layer — an event bus streaming pipeline plus CLI/IDE telemetry into AWS, DynamoDB, and Snowflake for ML analysis of developer pain points — and upgraded platform observability (Splunk, Dynatrace) behind a live health status page with subscribe-able alerts
      - Made the platform AI-native — MCP servers and out-of-the-box skills that let AI agents safely query and operate enterprise CI/CD systems, plus standardized patterns and pipelines carrying Google Cloud and Vertex AI workloads to production
      - Operate the enterprise CI/CD and DevSecOps toolchain end to end (Jenkins, GitHub Actions, Harness, AWS CodePipeline, Nexus, SonarQube, Checkmarx) keeping thousands of pipelines reliable
      - Led the enterprise migration from GitHub Enterprise Server to GitHub Enterprise Cloud, modernizing 10,000+ repositories in under 12 months
      - Recognized with the 2023 Enterprise Tech Data & Cyber Award for platform adoption and productivity impact
    technologies:
      - Internal Developer Platforms (IDP)
      - GitHub Enterprise Cloud
      - CI/CD (GitHub Actions, Harness, Jenkins, AWS CodePipeline, uDeploy)
      - DevSecOps (Checkmarx, SonarQube, Nexus)
      - Cloud & Data (AWS, DynamoDB, Snowflake, Google Cloud)
      - Observability (Splunk, Dynatrace)
      - AI (MCP)
      - Infrastructure as Code (Terraform)

    endDate: 2018
    summary: Owned application platforms and production operations, focusing on reliability, modernization, and DevOps enablement across the application portfolio.
    highlights:
      - Instrumented Dynatrace and Splunk monitoring and alerting across most of the line-of-business applications
      - Moved the line-of-business applications from AnthillPro to GitHub
      - Carried 24/7 on-call and led overnight triage and restoration of high-impact production incidents
      - Served as the primary point of ownership for full-stack applications across software, data, and infrastructure
    technologies:

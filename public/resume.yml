personalInfo:
  name: Anthony Brignano
  title: Senior Staff Software Engineer — Enterprise Platform Engineering
  email: hi@brignano.io
  location: Connecticut, USA
  website: https://brignano.io
  linkedin: https://www.linkedin.com/in/brignano
  github: https://github.com/brignano
summary: |
  Platform engineering leader who treats developer experience as a product. I'm the technical lead on ATLAS, The Hartford's internal developer platform for 4,000+ engineers, and led the company's move of 10,000+ repositories to GitHub Enterprise Cloud with zero downtime. Ten years across support, reliability, full-stack, data, quality, and platform roles mean I design for the engineers a platform serves.
experience:
  - company: The Hartford
    position: Senior Staff Software Engineer — Enterprise Platform Engineering
    location: Hartford, CT
    startDate: 2023
    endDate: Present
    summary: |
      Technical Lead for The Hartford's enterprise developer platform and developer experience strategy — the single pane of glass for 4,000+ engineers today, rolling out toward the full 8,000-engineer organization — owning the architecture and evolution of CI/CD, DevOps intelligence, internal developer tooling, and AI-native delivery patterns across the 13,000+ repositories the platform tracks.
    highlights:
      - Technical lead on ATLAS, the developer platform behind 4,000+ engineers, 13,000+ repositories, and 95,000+ pipelines, leading delivery for 6–8 engineers (10–12 during the GitHub migration)
      - Lead technical delivery for a CEO-sponsored initiative making engineer onboarding self-service — a new machine goes from unboxed to building in hours, against a 40+ day hire-to-first-commit baseline
      - Designed, launched, and delivered ATLAS Desktop (Electron, TypeScript), bridging browser, CLI, and IDE so a button on the site runs a native command — now on 2,000+ devices; the unified surface reached 1,000+ engineers in 90 days
      - Designed and led the GitHub Enterprise Server to Cloud migration — 10,000+ repositories in under 12 months — with zero downtime, personally designing changes to 52 integration points and retiring the self-hosted server and its costs
      - Made the platform AI-native with MCP servers and a catalog of 140+ vetted skills, servers, and agents that operate enterprise CI/CD safely, and moved tool-version and scan rules into OPA policy
      - Built telemetry in from day one (OpenTelemetry in the CLI, IDE, and desktop agent) and architected the event-bus pipeline into AWS behind live dashboards and a subscribe-able health status page
      - Led the response and root-cause analysis for a GKE build-agent CPU outage that stalled Harness builds for 80–100 teams, then hardened the CLI and pipelines; no similar incident since
      - Won the AIFEE Transformation Champions award and the 2023 Enterprise Tech Data & Cyber Award (GitHub Actions rollout); recognized in 2025 for the migration and AI-first development enablement
    technologies:
      - Internal Developer Platforms (IDP)
      - GitHub Enterprise Cloud
      - CI/CD (GitHub Actions, Harness, Jenkins, AWS CodePipeline, uDeploy)
      - DevSecOps (Checkmarx, SonarQube, Nexus)
      - Cloud & Data (AWS, DynamoDB, Snowflake, Google Cloud)
      - Observability (OpenTelemetry, Splunk, Dynatrace)
      - AI (MCP)
      - Policy as Code (OPA)
      - Infrastructure as Code (Terraform)
  - company: The Hartford
    position: Staff Software Engineer — Enterprise Quality Engineering
    location: Hartford, CT
    startDate: 2021
    endDate: 2023
    summary: Led Personal Insurance test automation modernization and helped lay the foundations of a shared enterprise automation platform.
    highlights:
      - Tech lead, product owner, and Scrum Master for a 3–5 engineer offshore team modernizing Personal Insurance test automation across coverage, test data, and observability
      - Cut the new policy platform's front-end test runs from hours to minutes by making the core library idempotent and removing blind sleeps
      - Automated customer-form validation for every supported state, replacing manual checks for the whole QA team
      - Helped build the shared Playwright framework; Playwright is now the company's front-end testing standard
      - Built the database API and front end for Hawkeye, the Personal Lines test-data tool
    technologies:
      - Playwright
      - Selenium
      - Cypress
      - Jenkins
      - Maven
  - company: The Hartford
    position: Senior Software Engineer — Batch Processing Modernization
    location: Hartford, CT
    startDate: 2020
    endDate: 2021
    summary: Owned modernization of enterprise batch processing pipelines supporting financial and regulatory reporting.
    highlights:
      - Helped choose the vendor platform that replaced 108 legacy applications, then built its premium integration (NPPS), which has since processed hundreds of millions of dollars in premium
      - Learned .NET and reverse-engineered legacy mainframe flat files to design the transformer that turns policy data into the general-ledger files premium reporting depends on
      - Built in failed-transaction reprocessing, balancing, recovery playbooks, and monitoring
      - Recognized in 2021 for NPPS design direction and for challenging the status quo
      - Established CI/CD, monitoring, and reliability standards for batch delivery
    technologies:
      - .NET
      - Oracle
      - Jenkins
      - uDeploy
      - Dynatrace
      - Sumo Logic
  - company: The Hartford
    position: Software Engineer — Full-Stack Development
    location: Hartford, CT
    startDate: 2018
    endDate: 2020
    summary: Built and supported customer-facing policy quoting and issuance platforms for Personal Lines insurance.
    highlights:
      - Helped build the entire front end of the new home insurance quoting and issuance platform in Angular, with a new team I coached on front-end best practices
      - Developed Java microservices supporting quoting and issuance
      - Integrated Oracle databases and third-party services for pricing and issuance
    technologies:
      - Java
